[project]
name = "os-agent"
version = "0.1.0"
description = "A computer-use agent — same success rate, a fraction of the latency"
requires-python = ">=3.11,<3.12"

# Dependencies are added per gate, not up front (CLAUDE.md §9).
# A1 needs: OS control, image handling, typed contracts, config, logging.
dependencies = [
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "black>=24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["os_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
